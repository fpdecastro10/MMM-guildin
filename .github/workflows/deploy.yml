name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/MMM-guildin

            # Pull latest code
            git pull origin main

            # Write RDS env file from GitHub secret (base64 encoded)
            echo "${{ secrets.ENV_RDS }}" | base64 --decode > ~/MMM-guildin/.env.rds

            # Rebuild image
            docker build -t mmm-guildin .

            # Swap container (~10-20s downtime)
            docker stop mmm-guildin-app 2>/dev/null || true
            docker rm mmm-guildin-app 2>/dev/null || true
            docker run -d \
              --name mmm-guildin-app \
              --restart unless-stopped \
              -p 8501:8501 \
              --env-file ~/MMM-guildin/.env.rds \
              mmm-guildin
